name: Foundation checks
on:
  pull_request:
  push:
    branches: [main, 'chore/**', 'feature/**', 'fix/**']
permissions:
  contents: read
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check foundation files
        run: |
          set -euo pipefail
          for f in README.md AGENTS.md docs/PROJECT_CONTEXT.md docs/ARCHITECTURE.md docs/ROADMAP.md docs/DECISIONS.md docs/CHECKPOINTS.md docs/DEVELOPMENT_LOG.md docs/ENVIRONMENT_SETUP.md; do
            test -s "$f" || { echo "Missing $f"; exit 1; }
          done
          echo 'Foundation files exist'
