name: Browser MVP checks
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run static checks and tests
        run: npm run check
      - name: Verify browser entry points
        run: |
          test -s index.html
          test -s styles.css
          test -s src/app.mjs
          test -s src/engine.mjs
